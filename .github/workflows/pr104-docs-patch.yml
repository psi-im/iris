name: PR 104 docs patch

on:
  push:
    branches:
      - ai/active-bundle-content-add

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/active-bundle-content-add
      - name: Document active BUNDLE extension transaction
        run: python3 .github/pr104_docs_patch.py
      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/jingle.md
          git commit -m 'Document active BUNDLE extension transaction'
          git push origin HEAD:ai/active-bundle-content-add
