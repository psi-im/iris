name: Fix Windows ZLIB and vcpkg cache

on:
  push:
    branches: [ ci/qca3-pipelines ]
    paths:
      - .github/workflows/fix-windows-zlib-cache.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/qca3-pipelines
          fetch-depth: 0

      - name: Apply Windows ZLIB and cache fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for filename in ('.github/workflows/ci.yml', '.github/workflows/packages.yml'):
              path = Path(filename)
              text = path.read_text()

              old_restore = '''      - name: Restore vcpkg binary cache on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.image }}-x64-windows-static-v1
          restore-keys: |
            iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-
'''
              new_restore = '''      - name: Restore vcpkg binary cache on Windows
        if: runner.os == 'Windows'
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.image }}-x64-windows-static-v1
          restore-keys: |
            iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-
'''
              if text.count(old_restore) != 1:
                  raise SystemExit(f'{filename}: restore block count={text.count(old_restore)}')
              text = text.replace(old_restore, new_restore)

              old_install = '''      - name: Install static zlib on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''
              new_install = old_install + '''
      - name: Save vcpkg binary cache on Windows
        if: runner.os == 'Windows' && steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.image }}-x64-windows-static-v1
'''
              if text.count(old_install) != 1:
                  raise SystemExit(f'{filename}: install block count={text.count(old_install)}')
              text = text.replace(old_install, new_install)

              old_config = '''          $zlibRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\\x64-windows-static'
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$pwd/sdk" `
            "-DCMAKE_PREFIX_PATH=$pwd/qca-sdk;$env:QT_ROOT_DIR" `
            "-DZLIB_ROOT=$zlibRoot" `
'''
              new_config = '''          $zlibRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\\x64-windows-static'
          $zlibLibrary = Join-Path $zlibRoot 'lib\\zlib.lib'
          $zlibInclude = Join-Path $zlibRoot 'include'
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$pwd/sdk" `
            "-DCMAKE_PREFIX_PATH=$pwd/qca-sdk;$env:QT_ROOT_DIR" `
            "-DZLIB_LIBRARY:FILEPATH=$zlibLibrary" `
            "-DZLIB_INCLUDE_DIR:PATH=$zlibInclude" `
'''
              if text.count(old_config) != 1:
                  raise SystemExit(f'{filename}: config block count={text.count(old_config)}')
              text = text.replace(old_config, new_config)
              path.write_text(text)

          cmake_path = Path('src/xmpp/CMakeLists.txt')
          text = cmake_path.read_text()
          old = '''cmake_minimum_required(VERSION 3.10.0)

if(POLICY CMP0074)
    cmake_policy(SET CMP0074 NEW)
endif()
if(WIN32 AND ZLIB_ROOT)
    set(_iris_zlib_library "${ZLIB_ROOT}/lib/zlib.lib")
    set(_iris_zlib_include "${ZLIB_ROOT}/include")
    if(EXISTS "${_iris_zlib_library}" AND EXISTS "${_iris_zlib_include}/zlib.h")
        set(ZLIB_LIBRARY "${_iris_zlib_library}" CACHE FILEPATH "ZLIB library" FORCE)
        set(ZLIB_INCLUDE_DIR "${_iris_zlib_include}" CACHE PATH "ZLIB include directory" FORCE)
    endif()
endif()
find_package(ZLIB REQUIRED)
'''
          new = '''cmake_minimum_required(VERSION 3.10.0)

find_package(ZLIB REQUIRED)
'''
          if text.count(old) != 1:
              raise SystemExit(f'src/xmpp/CMakeLists.txt: workaround block count={text.count(old)}')
          cmake_path.write_text(text.replace(old, new))
          PY

          git rm .github/workflows/fix-windows-zlib-cache.yml
          git add .github/workflows/ci.yml .github/workflows/packages.yml src/xmpp/CMakeLists.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix Windows ZLIB configuration and cache"
          git push origin HEAD:ci/qca3-pipelines
