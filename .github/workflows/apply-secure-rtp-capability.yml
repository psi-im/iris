name: Apply secure RTP capability patch

on:
  push:
    branches:
      - jingle/async-media

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: contains(github.event.head_commit.message, 'Stage secure RTP capability patch')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: jingle/async-media
      - run: python3 .github/secure-rtp-capability-patch.py
      - run: |
          git rm .github/workflows/apply-secure-rtp-capability.yml .github/secure-rtp-capability-patch.py
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add src/xmpp/xmpp-im/jingle-rtp-srtp.h src/xmpp/xmpp-im/jingle-rtp-srtp.cpp src/xmpp/xmpp-im/jingle-ice.cpp tests/jingle/dtlssrtp.cpp
          git commit -m 'Expose runtime secure RTP capabilities'
          git push origin HEAD:jingle/async-media
