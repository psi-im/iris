name: Jingle regressions

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iris-jingle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-tests:
    uses: ./.github/workflows/jingle-filter.yml

  qca3-srtp:
    needs: select-tests
    if: needs.select-tests.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache gdb qt6-base-dev libssl-dev libusrsctp-dev

      - name: Cache compiler objects
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: iris-jingle-qca3-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            iris-jingle-qca3-${{ runner.os }}-



      - uses: ./.github/actions/load-dependencies
        with:
          qca-asset: qca3-deb-ubuntu-24.04.zip
          install-mode: apt
          qca-directory: qca-release

      - name: Configure
        shell: bash
        run: |
          cmake -S tests/jingle -B build-jingle -G Ninja \
            -DUSE_QT6=ON \
            -DIRIS_SYSTEM_QCA=3 \
            -DIRIS_BUNDLED_QCA=OFF \
            -DIRIS_BUNDLED_USRSCTP=OFF \
            -DIRIS_ENABLE_JINGLE_SCTP=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-jingle --parallel 4

      - name: Verify root test build switch
        shell: bash
        run: |
          set -euo pipefail
          common=(
            -G Ninja
            -DUSE_QT6=ON
            -DIRIS_ENABLE_OMEMO=OFF
            -DIRIS_SYSTEM_QCA=3
            -DIRIS_BUNDLED_QCA=OFF
            -DIRIS_BUNDLED_USRSCTP=OFF
            -DIRIS_ENABLE_JINGLE_SCTP=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          )

          cmake -S . -B build-root-no-tests "${common[@]}" -DIRIS_BUILD_TESTS=OFF
          if ninja -C build-root-no-tests -t targets all | grep -Eq '^jingle_.*_test:'; then
            echo "IRIS_BUILD_TESTS=OFF still created Jingle test targets" >&2
            exit 1
          fi

          cmake -S . -B build-root-tests "${common[@]}" -DIRIS_BUILD_TESTS=ON
          cmake --build build-root-tests --parallel 4 --target jingle_dtlssrtp_test

      - name: Save compiler cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: iris-jingle-qca3-${{ runner.os }}-${{ github.sha }}

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Test
        run: ctest --test-dir build-jingle --output-on-failure -j1


  transport-sanitizers:
    needs: select-tests
    if: needs.select-tests.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache sanitizer compiler objects
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: iris-jingle-sanitize-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            iris-jingle-sanitize-${{ runner.os }}-

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache qt6-base-dev libssl-dev libusrsctp-dev



      - uses: ./.github/actions/load-dependencies
        with:
          qca-asset: qca3-deb-ubuntu-24.04.zip
          install-mode: apt
          qca-directory: qca-release

      - name: Configure ASan and UBSan
        shell: bash
        run: |
          cmake -S tests/jingle -B build-jingle-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize=enum -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=enum -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=enum" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=enum" \
            -DUSE_QT6=ON \
            -DIRIS_SYSTEM_QCA=3 \
            -DIRIS_BUNDLED_QCA=OFF \
            -DIRIS_BUNDLED_USRSCTP=OFF \
            -DIRIS_ENABLE_JINGLE_SCTP=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build transport lifetime regressions
        run: |
          cmake --build build-jingle-sanitize --parallel 4 --target \
            jingle_transports5b_test \
            jingle_transportsctp_test \
            jingle_transportacceptatomicity_test \
            jingle_transportacceptackreentrancy_test \
            jingle_transportacceptselfreentrancy_test \
            jingle_transportrejectatomicity_test \
            jingle_transportrejectreentrancy_test \
            jingle_transportreplace_test \
            jingle_transportreplacematrix_test \
            jingle_transportreplaceackboundary_test \
            jingle_transportreplacedispatcher_test \
            jingle_transportreplacecorrectness_test \
            jingle_transportreplaceprotocol_test \
            jingle_rtpnegotiation_test \
            jingle_dtlssrtp_test \
            jingle_domlifetime_test \
            jingle_ftlifecycle_test \
            jingle_connectionwaiter_test \
            jingle_ibblifecycle_test \
            jingle_bundlesignaling_test

      - name: Save sanitizer compiler cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: iris-jingle-sanitize-${{ runner.os }}-${{ github.sha }}

      - name: Show sanitizer ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Test transport lifetime regressions under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build-jingle-sanitize --output-on-failure -j1 \
            -R '^jingle_transport(accept|reject|replace|s5b|sctp)'
          ctest --test-dir build-jingle-sanitize --output-on-failure -j1 -R jingle_domlifetime
          ctest --test-dir build-jingle-sanitize --output-on-failure -j1 -R 'jingle_(ftlifecycle|connectionwaiter)'
          ctest --test-dir build-jingle-sanitize --output-on-failure -j1 -R 'jingle_(ibblifecycle|bundlesignaling)'
          ctest --test-dir build-jingle-sanitize --output-on-failure -j1 -R jingle_rtpnegotiation
          ctest --test-dir build-jingle-sanitize --output-on-failure -j1 -R jingle_dtlssrtp

archlinux-jingle-dtls:
    name: archlinux-jingle-dtls
    needs: select-tests
    if: needs.select-tests.outputs.run == 'true'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    timeout-minutes: 55
    steps:
      - name: Install matching system Qt, OpenSSL and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git jq pkgconf \
            qt6-base openssl libusrsctp
          pacman -Q qt6-base openssl
          openssl version
          # Test system OpenSSL 4.x, not an SDK grafted onto another Qt.
          openssl version | grep -E '^OpenSSL 4\.[1-9][0-9]*\.'
          test -e /usr/lib/libssl.so.4
          test -e /usr/lib/libcrypto.so.4

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify system Qt TLS backend loads system OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/iris-qt-system-tls.cpp <<'CPP'
          #include <QCoreApplication>
          #include <QSslSocket>
          #include <QDebug>
          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              if (!QSslSocket::setActiveBackend(QStringLiteral("openssl")))
                  return 1;
              if (!QSslSocket::supportsSsl())
                  return 2;
              const QString version = QSslSocket::sslLibraryVersionString();
              qInfo().noquote() << "Qt TLS runtime:" << version;
              return version.startsWith(QStringLiteral("OpenSSL 4.")) ? 0 : 3;
          }
          CPP
          c++ /tmp/iris-qt-system-tls.cpp $(pkg-config --cflags --libs Qt6Network) \
            -o /tmp/iris-qt-system-tls
          /tmp/iris-qt-system-tls

      - name: Build locked QCA3 with Arch system OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          qca_tag=$(jq -r '.qca.tag' dependencies.lock.json)
          qca_commit=$(jq -r '.qca.commit' dependencies.lock.json)
          test "$qca_tag" = v3.2.0
          git clone --depth 1 --branch "$qca_tag" https://github.com/psi-im/qca.git qca-arch-src
          test "$(git -C qca-arch-src rev-parse HEAD)" = "$qca_commit"

          qca_prefix="$GITHUB_WORKSPACE/qca-arch-sdk"
          echo "QCA_ARCH_PREFIX=$qca_prefix" >> "$GITHUB_ENV"
          cmake -S qca-arch-src -B qca-arch-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON -DQCA_SUFFIX=qt6 \
            -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_PLUGINS=ossl \
            -DQCA_INSTALL_IN_QT_PREFIX=OFF \
            -DCMAKE_INSTALL_PREFIX="$qca_prefix"
          cmake --build qca-arch-build --parallel 4
          cmake --install qca-arch-build

          provider=$(find "$qca_prefix/lib/qca3-qt6" -type f -name '*qca-ossl*.so' -print -quit)
          test -n "$provider"
          ldd "$provider" | tee /tmp/iris-qca-provider-ldd.log
          # Verify the provider's actual ELF dependencies, not just headers.
          grep -E 'libssl\.so\.4 => /usr/lib/libssl\.so\.4' /tmp/iris-qca-provider-ldd.log
          grep -E 'libcrypto\.so\.4 => /usr/lib/libcrypto\.so\.4' /tmp/iris-qca-provider-ldd.log

      - name: Build Jingle DTLS-SRTP and SCTP integration test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/jingle -B build-jingle-arch -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_QT6=ON -DIRIS_SYSTEM_QCA=3 -DIRIS_BUNDLED_QCA=OFF \
            -DIRIS_ENABLE_OMEMO=OFF -DIRIS_ENABLE_JINGLE_SCTP=ON \
            -DIRIS_BUNDLED_USRSCTP=OFF \
            -DCMAKE_PREFIX_PATH="$QCA_ARCH_PREFIX" \
            -DQca3-qt6_DIR="$QCA_ARCH_PREFIX/lib/cmake/Qca3-qt6"
          cmake --build build-jingle-arch --parallel 4 \
            --target jingle_dtlssrtp_test

      - name: Verify Jingle DTLS handshake and SRTP key export
        shell: bash
        run: |
          set -euo pipefail
          export QCA_PLUGIN_PATH="$QCA_ARCH_PREFIX/lib/qca3-qt6"
          export LD_LIBRARY_PATH="$QCA_ARCH_PREFIX/lib:\${LD_LIBRARY_PATH:-}"
          QT_DEBUG_PLUGINS=1 LD_DEBUG=libs \
            ./build-jingle-arch/jingle_dtlssrtp_test \
            > /tmp/iris-jingle-arch-dtls.log 2>&1 || {
              tail -n 140 /tmp/iris-jingle-arch-dtls.log
              exit 1
            }
          grep -F 'Iris/QCA3 DTLS-SRTP key-export and SCTP mux integration passed' \
            /tmp/iris-jingle-arch-dtls.log
          grep -F '/usr/lib/libssl.so.4' /tmp/iris-jingle-arch-dtls.log
          grep -F '/usr/lib/libcrypto.so.4' /tmp/iris-jingle-arch-dtls.log
          grep -E 'loaded library.*qca-ossl|qca-ossl.*loaded' \
            /tmp/iris-jingle-arch-dtls.log | head -n 3
