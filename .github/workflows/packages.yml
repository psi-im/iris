name: Iris packages
run-name: Iris packages ${{ inputs.source_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to package; defaults to the selected workflow ref
        required: false
        type: string
  push:
    tags: [ 'v1*' ]

permissions:
  contents: read

env:
  QT_VERSION: 6.10.2
  ANDROID_QT_VERSION: 6.11.2
  QCA_TAG: v3.0.1
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Resolve source ref and package version
        id: resolve
        shell: bash
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_ref=${INPUT_SOURCE_REF:-$GITHUB_REF}
          tag=""
          if [[ -n "${INPUT_SOURCE_REF:-}" && "$INPUT_SOURCE_REF" == v* ]]; then
            tag=$INPUT_SOURCE_REF
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(git tag --points-at HEAD --list 'v*' --sort=-version:refname | head -n1)
          fi

          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v([0-9]+(\.[0-9]+){1,3})$ ]]; then
              echo "::error::Unsupported release tag '$tag'; expected vN.N, vN.N.N or vN.N.N.N"
              exit 1
            fi
            version=${BASH_REMATCH[1]}
          else
            version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+(\.[0-9]+){1,3})[[:space:]]*$/\1/p' CMakeLists.txt | head -n1)
            if [[ -z "$version" ]]; then
              version=$(sed -nE 's/^[[:space:]]*"([0-9]+(\.[0-9]+){1,3})"[[:space:]]*$/\1/p' CMakeLists.txt | head -n1)
            fi
          fi

          if [[ -z "$version" ]]; then
            echo "::error::Could not resolve Iris package version"
            exit 1
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging $source_ref as Iris $version"

  debian:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version:
          - "24.04"
          - "26.04"
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Set package version
        shell: bash
        env:
          IRIS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()
          version = os.environ["IRIS_VERSION"]
          configurable = r'(?ms)(set\(IRIS_VERSION\s+")[0-9]+(?:\.[0-9]+){1,3}("\s+CACHE STRING "Iris project version"\))'
          literal = r'(?ms)(project\(\s*iris\s+VERSION\s+)[0-9]+(?:\.[0-9]+){1,3}'
          if re.search(configurable, text):
              text, count = re.subn(configurable, lambda m: m.group(1) + version + m.group(2), text, count=1)
          else:
              text, count = re.subn(literal, lambda m: m.group(1) + version, text, count=1)
          if count != 1:
              raise SystemExit("Could not apply Iris package version to CMakeLists.txt")
          path.write_text(text)
          PY

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build dpkg-dev qt6-base-dev zlib1g-dev libusrsctp-dev libomemo-c-dev

      - name: Install QCA3 release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir qca-release
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p "qca3-deb-ubuntu-${{ matrix.ubuntu-version }}.zip" -O qca3.zip
          (cd qca-release && cmake -E tar xvf ../qca3.zip)
          test -n "$(find qca-release -type f -name '*.deb' -print -quit)"
          sudo apt-get install -y ./qca-release/*.deb

      - name: Build and stage
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DUSE_QT6=ON \
            -DIRIS_SYSTEM_QCA=3 -DIRIS_BUNDLED_QCA=OFF \
            -DIRIS_ENABLE_OMEMO=ON -DIRIS_BUNDLED_OMEMO_C=OFF \
            -DIRIS_BUNDLED_USRSCTP=OFF
          cmake --build build --parallel
          DESTDIR="$PWD/stage" cmake --install build

      - name: Build split deb packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          arch=$(dpkg --print-architecture)
          if ! find stage -type f -name "libiris-qt6.so.$version" -print -quit | grep -q .; then
            echo "::error::Staged Iris library does not carry release version $version"
            find stage -type f -name 'libiris-qt6.so*' -print
            exit 1
          fi
          test -n "$version"
          mkdir -p debs work/{runtime,dev}

          while IFS= read -r -d '' f; do
            rel=${f#stage/}
            case "$rel" in
              usr/include/*|*/cmake/*|*/pkgconfig/*|*/libiris-qt6.so) dst=dev ;;
              *) dst=runtime ;;
            esac
            mkdir -p "work/$dst/$(dirname "$rel")"
            cp -a "$f" "work/$dst/$rel"
          done < <(find stage \( -type f -o -type l \) -print0)

          make_deb() {
            dir=$1 pkg=$2 depends=$3 desc=$4
            mkdir -p "$dir/DEBIAN"
            cat > "$dir/DEBIAN/control" <<CTRL
          Package: $pkg
          Version: $version
          Architecture: $arch
          Maintainer: Psi IM developers
          Depends: $depends
          Section: libs
          Priority: optional
          Description: $desc
          CTRL
            dpkg-deb --build --root-owner-group "$dir" "debs/${pkg}_${version}_${arch}.deb"
          }

          # Let dpkg resolve distro-specific runtime package names from the
          # actual linked library. QCA3 is our own package and does not yet
          # ship Debian shlibs metadata, so append it explicitly.
          mkdir -p debian
          cat > debian/control <<CTRL
          Source: iris
          Section: libs
          Priority: optional
          Maintainer: Psi IM developers
          Standards-Version: 4.6.2

          Package: libiris-qt6-1
          Architecture: any
          Depends: \${shlibs:Depends}
          Description: Iris Qt6 XMPP runtime library
           Iris Qt6 XMPP runtime library
          CTRL

          runtime_so=$(find work/runtime -type f -name 'libiris-qt6.so.*' -print -quit)
          test -n "$runtime_so"
          runtime_depends=$(
            dpkg-shlibdeps --ignore-missing-info -O "$runtime_so" \
              | sed -n 's/^shlibs:Depends=//p'
          )
          test -n "$runtime_depends"
          runtime_depends="$runtime_depends, libqca3-qt6-3"
          echo "Runtime dependencies: $runtime_depends"

          make_deb work/runtime libiris-qt6-1 \
            "$runtime_depends" \
            'Iris Qt6 XMPP runtime library'
          make_deb work/dev libiris-qt6-dev \
            "libiris-qt6-1 (= $version), libqca3-qt6-dev, qt6-base-dev, libusrsctp-dev" \
            'Iris Qt6 XMPP development files'
          ls -l debs
          for deb in debs/*.deb; do
            actual=$(dpkg-deb -f "$deb" Version)
            if [[ "$actual" != "$version" ]]; then
              echo "::error::$deb has version '$actual', expected '$version'"
              exit 1
            fi
          done

      - name: Install package smoke test
        shell: bash
        run: |
          sudo apt-get install -y ./debs/*.deb

      - name: Compile installed CMake consumer
        shell: bash
        run: |
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(iris_consumer LANGUAGES CXX)
          find_package(Iris CONFIG REQUIRED)
          add_executable(iris-consumer main.cpp)
          target_link_libraries(iris-consumer PRIVATE Iris::Iris)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <iris/jid/jid.h>
          #include <iris/xmpp_omemo.h>
          int main()
          {
              XMPP::Jid jid(QStringLiteral("package@example.org"));
              return jid.isValid() && !XMPP::OmemoEncryption::methodId().isEmpty() ? 0 : 1;
          }
          CPP
          cmake -S consumer -B consumer-build -G Ninja
          cmake --build consumer-build
          ./consumer-build/iris-consumer

      - uses: actions/upload-artifact@v4
        with:
          name: iris-deb-ubuntu-${{ matrix.ubuntu-version }}
          path: debs/*.deb
          if-no-files-found: error

  desktop-sdk:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Set package version
        shell: bash
        env:
          IRIS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()
          version = os.environ["IRIS_VERSION"]
          configurable = r'(?ms)(set\(IRIS_VERSION\s+")[0-9]+(?:\.[0-9]+){1,3}("\s+CACHE STRING "Iris project version"\))'
          literal = r'(?ms)(project\(\s*iris\s+VERSION\s+)[0-9]+(?:\.[0-9]+){1,3}'
          if re.search(configurable, text):
              text, count = re.subn(configurable, lambda m: m.group(1) + version + m.group(2), text, count=1)
          else:
              text, count = re.subn(literal, lambda m: m.group(1) + version, text, count=1)
          if count != 1:
              raise SystemExit("Could not apply Iris package version to CMakeLists.txt")
          path.write_text(text)
          PY

      - name: Build, install and smoke-test Iris SDK
        uses: ./.github/actions/build-iris-desktop
        with:
          qt-version: ${{ env.QT_VERSION }}
          platform: ${{ matrix.platform }}
          qca-tag: ${{ env.QCA_TAG }}
          install-prefix: ${{ github.workspace }}/sdk

      - name: Stage SDK licenses
        shell: bash
        run: |
          mkdir -p sdk/share/licenses/iris
          cp COPYING sdk/share/licenses/iris/COPYING
          license=$(find build/_deps/usrsctp -type f -name LICENSE.md -print -quit)
          test -n "$license"
          mkdir -p sdk/share/licenses/iris/usrsctp
          cp "$license" sdk/share/licenses/iris/usrsctp/LICENSE.md
          if find sdk/lib -type f \( -name '*usrsctp*' -o -name '*qca3*' \) -print -quit | grep -q .; then
            echo 'Iris SDK unexpectedly contains a private dependency library' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: iris-qt6-${{ matrix.platform }}
          path: sdk/
          if-no-files-found: error

  android-sdk:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
          - abi: x86
            qt_arch: android_x86
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Set package version
        shell: bash
        env:
          IRIS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("CMakeLists.txt")
          text = path.read_text()
          version = os.environ["IRIS_VERSION"]
          configurable = r'(?ms)(set\(IRIS_VERSION\s+")[0-9]+(?:\.[0-9]+){1,3}("\s+CACHE STRING "Iris project version"\))'
          literal = r'(?ms)(project\(\s*iris\s+VERSION\s+)[0-9]+(?:\.[0-9]+){1,3}'
          if re.search(configurable, text):
              text, count = re.subn(configurable, lambda m: m.group(1) + version + m.group(2), text, count=1)
          else:
              text, count = re.subn(literal, lambda m: m.group(1) + version, text, count=1)
          if count != 1:
              raise SystemExit("Could not apply Iris package version to CMakeLists.txt")
          path.write_text(text)
          PY

      - name: Build and install Iris SDK
        id: build-iris
        uses: ./.github/actions/build-iris-android
        with:
          qt-version: ${{ env.ANDROID_QT_VERSION }}
          qt-arch: ${{ matrix.qt_arch }}
          abi: ${{ matrix.abi }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          qca-tag: ${{ env.QCA_TAG }}
          install-prefix: ${{ github.workspace }}/sdk
          build-type: RelWithDebInfo

      - name: Stage SDK licenses
        shell: bash
        run: |
          mkdir -p sdk/share/licenses/iris
          cp COPYING sdk/share/licenses/iris/COPYING
          license=$(find build/_deps/usrsctp -type f -name LICENSE.md -print -quit)
          test -n "$license"
          mkdir -p sdk/share/licenses/iris/usrsctp
          cp "$license" sdk/share/licenses/iris/usrsctp/LICENSE.md
          if find sdk/lib -type f \( -name '*usrsctp*' -o -name '*qca3*' \) -print -quit | grep -q .; then
            echo 'Iris SDK unexpectedly contains a private dependency library' >&2
            exit 1
          fi

      - name: Extract Android debug symbols and strip SDK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.build-iris.outputs.ndk-path }}
        run: |
          set -euo pipefail
          toolchain_bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          llvm_objcopy="$toolchain_bin/llvm-objcopy"
          llvm_strip="$toolchain_bin/llvm-strip"
          test -x "$llvm_objcopy"
          test -x "$llvm_strip"

          rm -rf symbols
          mkdir -p symbols
          while IFS= read -r -d '' lib; do
            rel=${lib#sdk/}
            debug="symbols/${rel}.debug"
            mkdir -p "$(dirname "$debug")"
            "$llvm_objcopy" --only-keep-debug "$lib" "$debug"
            "$llvm_strip" --strip-unneeded "$lib"
            "$llvm_objcopy" --add-gnu-debuglink="$debug" "$lib"
            test -s "$debug"
            if readelf -S "$lib" | grep -q '\.debug_'; then
              echo "Debug sections remain after stripping: $lib" >&2
              exit 1
            fi
          done < <(find sdk -type f \( -name '*.so' -o -name '*.so.*' \) -print0)
          test -n "$(find symbols -type f -name '*.debug' -print -quit)"

      - name: Compile installed CMake consumer
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.build-iris.outputs.ndk-path }}
        run: |
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(iris_consumer LANGUAGES CXX)
          find_package(Iris CONFIG REQUIRED)
          add_library(iris-consumer SHARED main.cpp)
          target_link_libraries(iris-consumer PRIVATE Iris::Iris)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <iris/jid/jid.h>
          #include <iris/xmpp_omemo.h>
          extern "C" int iris_consumer_smoke()
          {
              XMPP::Jid jid(QStringLiteral("package@example.org"));
              return jid.isValid() && !XMPP::OmemoEncryption::methodId().isEmpty() ? 0 : 1;
          }
          CPP
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          "$qt_cmake" -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            "-DIris_DIR=$PWD/sdk/lib/cmake/Iris" \
            "-DQca3-qt6_DIR=$PWD/qca-sdk/lib/cmake/Qca3-qt6"
          cmake --build consumer-build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: iris-qt6-android-${{ matrix.abi }}
          path: sdk/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: iris-qt6-android-${{ matrix.abi }}-symbols
          path: symbols/
          if-no-files-found: error
