name: Iris packages
run-name: Iris packages ${{ inputs.source_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to package; defaults to the selected workflow ref
        required: false
        type: string
  push:
    tags: [ 'v1*' ]

permissions:
  contents: read

env:
  QT_VERSION: 6.10.2
  ANDROID_QT_VERSION: 6.11.2
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: 28

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      qca_tag: ${{ steps.resolve.outputs.qca_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/load-dependencies

      - name: Resolve source ref and package version
        id: resolve
        shell: bash
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_ref=${INPUT_SOURCE_REF:-$GITHUB_REF}
          version=""

          if [[ -n "${INPUT_SOURCE_REF:-}" && "$INPUT_SOURCE_REF" == v* ]]; then
            version=${INPUT_SOURCE_REF#v}
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
          elif [[ -f .version ]]; then
            version=$(tr -d '[:space:]' < .version)
            version=${version#v}
          else
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            version=${tag#v}
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(\.[0-9]+)?$ ]]; then
            echo "::error::Cannot resolve a valid Iris version from '$source_ref'"
            exit 1
          fi

          printf '%s\n' "$version" > .version
          source_sha=$(git rev-parse HEAD)
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "qca_tag=$QCA_TAG" >> "$GITHUB_OUTPUT"
          echo "Packaging $source_ref as Iris $version"
          jq -n --arg sha "$source_sha" --arg version "$version" \
            '{source_sha: $sha, version: $version}' > "$RUNNER_TEMP/iris-package-source.json"

      - name: Record package source
        uses: actions/upload-artifact@v4
        with:
          name: iris-package-source
          overwrite: true
          path: ${{ runner.temp }}/iris-package-source.json
          if-no-files-found: error

  ubuntu:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version:
          - "24.04"
          - "26.04"
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          fetch-depth: 0

      - name: Materialize package version
        shell: bash
        run: |
          printf '%s\n' "${{ needs.version.outputs.version }}" > .version

      - name: Checkout packaging workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: packaging-workflow

      - name: Build, package and smoke-test Iris
        uses: ./packaging-workflow/.github/actions/build-iris-deb
        with:
          distribution: ubuntu-${{ matrix.ubuntu-version }}
          version: ${{ needs.version.outputs.version }}
          qca-tag: ${{ needs.version.outputs.qca_tag }}

  debian:
    name: Debian 13 (amd64)
    needs: version
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Bootstrap Debian build tools
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends ca-certificates git sudo build-essential gh
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          fetch-depth: 0

      - name: Materialize package version
        shell: bash
        run: printf '%s\n' '${{ needs.version.outputs.version }}' > .version

      - name: Checkout packaging workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: packaging-workflow

      - name: Build, package and smoke-test Iris
        uses: ./packaging-workflow/.github/actions/build-iris-deb
        with:
          distribution: debian-13
          version: ${{ needs.version.outputs.version }}
          qca-tag: ${{ needs.version.outputs.qca_tag }}

  desktop-sdk:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          fetch-depth: 0

      - name: Materialize package version
        shell: bash
        run: |
          printf '%s\n' "${{ needs.version.outputs.version }}" > .version

      - name: Build, install and smoke-test Iris SDK
        uses: ./.github/actions/build-iris-desktop
        with:
          qt-version: ${{ env.QT_VERSION }}
          platform: ${{ matrix.platform }}
          qca-tag: ${{ needs.version.outputs.qca_tag }}
          install-prefix: ${{ github.workspace }}/sdk

      - name: Stage SDK licenses
        shell: bash
        run: |
          mkdir -p sdk/share/licenses/iris
          cp COPYING sdk/share/licenses/iris/COPYING
          license=$(find build/_deps/usrsctp -type f -name LICENSE.md -print -quit)
          test -n "$license"
          mkdir -p sdk/share/licenses/iris/usrsctp
          cp "$license" sdk/share/licenses/iris/usrsctp/LICENSE.md
          if find sdk/lib -type f \( -name '*usrsctp*' -o -name '*qca3*' \) -print -quit | grep -q .; then
            echo 'Iris SDK unexpectedly contains a private dependency library' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: iris-qt6-${{ matrix.platform }}
          path: sdk/
          if-no-files-found: error

  android-sdk:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
          - abi: x86
            qt_arch: android_x86
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          fetch-depth: 0

      - name: Materialize package version
        shell: bash
        run: |
          printf '%s\n' "${{ needs.version.outputs.version }}" > .version

      - name: Build and install Iris SDK
        id: build-iris
        uses: ./.github/actions/build-iris-android
        with:
          qt-version: ${{ env.ANDROID_QT_VERSION }}
          qt-arch: ${{ matrix.qt_arch }}
          abi: ${{ matrix.abi }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          android-api: ${{ env.ANDROID_API }}
          qca-tag: ${{ needs.version.outputs.qca_tag }}
          install-prefix: ${{ github.workspace }}/sdk
          build-type: RelWithDebInfo

      - name: Stage SDK licenses
        shell: bash
        run: |
          mkdir -p sdk/share/licenses/iris
          cp COPYING sdk/share/licenses/iris/COPYING
          license=$(find build/_deps/usrsctp -type f -name LICENSE.md -print -quit)
          test -n "$license"
          mkdir -p sdk/share/licenses/iris/usrsctp
          cp "$license" sdk/share/licenses/iris/usrsctp/LICENSE.md
          if find sdk/lib -type f \( -name '*usrsctp*' -o -name '*qca3*' \) -print -quit | grep -q .; then
            echo 'Iris SDK unexpectedly contains a private dependency library' >&2
            exit 1
          fi

      - name: Extract Android debug symbols and strip SDK
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.build-iris.outputs.ndk-path }}
        run: |
          set -euo pipefail
          toolchain_bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          llvm_objcopy="$toolchain_bin/llvm-objcopy"
          llvm_strip="$toolchain_bin/llvm-strip"
          test -x "$llvm_objcopy"
          test -x "$llvm_strip"

          rm -rf symbols
          mkdir -p symbols
          while IFS= read -r -d '' lib; do
            rel=${lib#sdk/}
            debug="symbols/${rel}.debug"
            mkdir -p "$(dirname "$debug")"
            "$llvm_objcopy" --only-keep-debug "$lib" "$debug"
            "$llvm_strip" --strip-unneeded "$lib"
            "$llvm_objcopy" --add-gnu-debuglink="$debug" "$lib"
            test -s "$debug"
            if readelf -S "$lib" | grep -q '\.debug_'; then
              echo "Debug sections remain after stripping: $lib" >&2
              exit 1
            fi
          done < <(find sdk -type f \( -name '*.so' -o -name '*.so.*' \) -print0)
          test -n "$(find symbols -type f -name '*.debug' -print -quit)"

      - name: Compile installed CMake consumer
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.build-iris.outputs.ndk-path }}
        run: |
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(iris_consumer LANGUAGES CXX)
          find_package(Iris CONFIG REQUIRED)
          add_library(iris-consumer SHARED main.cpp)
          target_link_libraries(iris-consumer PRIVATE Iris::Iris)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <iris/jid/jid.h>
          #include <iris/xmpp_omemo.h>
          extern "C" int iris_consumer_smoke()
          {
              XMPP::Jid jid(QStringLiteral("package@example.org"));
              return jid.isValid() && !XMPP::OmemoEncryption::methodId().isEmpty() ? 0 : 1;
          }
          CPP
          qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
          "$qt_cmake" -S consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            "-DIris_DIR=$PWD/sdk/lib/cmake/Iris" \
            "-DQca3-qt6_DIR=$PWD/qca-sdk/lib/cmake/Qca3-qt6"
          cmake --build consumer-build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: iris-qt6-android-${{ matrix.abi }}
          path: sdk/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: iris-qt6-android-${{ matrix.abi }}-symbols
          path: symbols/
          if-no-files-found: error
