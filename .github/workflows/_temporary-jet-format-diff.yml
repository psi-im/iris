name: Temporary JET format diff
on:
  push:
    branches: [feat/encryption-session-stream-api]
    paths:
      - .github/workflows/_temporary-jet-format-diff.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show clang-format changes
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git-clang-format-18 >/dev/null || ! command -v clang-format-18 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang-format-18
          fi
          git clang-format-18 --binary clang-format-18 4a705e8793fe96b9a37f889fd3d6e495f11cadda || test -n "$(git diff --name-only)"
          git diff --check
          git diff -- src/xmpp/xmpp-im/jingle-jet.h src/xmpp/xmpp-im/jingle-jet.cpp src/xmpp/xmpp-im/jingle-jet-cipher.cpp src/xmpp/xmpp-im/jingle-jet-connection.h src/xmpp/xmpp-im/jingle-jet-connection.cpp src/xmpp/xmpp-im/jingle-ft.cpp src/xmpp/xmpp-im/jingle-ft.h src/xmpp/xmpp-im/jingle.cpp src/xmpp/xmpp-im/jingle.h src/xmpp/xmpp-im/jingle-jet-omemo.cpp src/xmpp/xmpp-im/jingle-jet-omemo.h tests/jingle/jetconnection.cpp tests/jingle/jetregistry.cpp
