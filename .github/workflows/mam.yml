name: MAM regressions

on:
  pull_request:
    paths:
      - 'src/xmpp/xmpp-im/xmpp_mam*'
      - 'src/xmpp/xmpp-im/xmpp_tasks.cpp'
      - 'src/xmpp/xmpp-im/xmpp_forwarding.cpp'
      - 'src/xmpp/xmpp-im/types.cpp'
      - 'tests/mam/**'
      - 'CMakeLists.txt'
      - '.github/workflows/mam.yml'
  push:
    branches: [master]
    paths:
      - 'src/xmpp/xmpp-im/xmpp_mam*'
      - 'src/xmpp/xmpp-im/xmpp_tasks.cpp'
      - 'src/xmpp/xmpp-im/xmpp_forwarding.cpp'
      - 'src/xmpp/xmpp-im/types.cpp'
      - 'tests/mam/**'
      - 'CMakeLists.txt'
      - '.github/workflows/mam.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iris-mam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mam:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qt5-qca2
            deps: qtbase5-dev libqca-qt5-2-dev libb2-dev
            cmake: -DIRIS_SYSTEM_QCA=2
          - name: qt6-qca3
            deps: qt6-base-dev
            cmake: -DUSE_QT6=ON -DIRIS_SYSTEM_QCA=3
    name: MAM (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev ${{ matrix.deps }}
      - uses: ./.github/actions/load-dependencies
        if: matrix.name == 'qt6-qca3'
        with:
          qca-asset: qca3-deb-ubuntu-24.04.zip
          install-mode: apt
          qca-directory: qca-release
      - name: Configure
        run: |
          cmake -S . -B build-mam -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIRIS_BUILD_TESTS=ON \
            -DIRIS_ENABLE_OMEMO=OFF \
            -DIRIS_BUNDLED_QCA=OFF \
            -DIRIS_BUNDLED_USRSCTP=OFF \
            -DIRIS_ENABLE_JINGLE_SCTP=OFF \
            ${{ matrix.cmake }}
      - name: Build MAM regression
        run: cmake --build build-mam --parallel 4 --target iris_mamtask_test
      - name: Test MAM query lifecycle
        run: ctest --test-dir build-mam --output-on-failure -R '^iris_mamtask$'
