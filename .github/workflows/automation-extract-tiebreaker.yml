name: Extract Jingle TieBreaker

on:
  push:
    branches:
      - automation/fix-jingle-parser
    paths:
      - .automation-trigger-extract-tiebreaker

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: automation/fix-jingle-parser
          path: helper
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: jingle/async-media
          fetch-depth: 0
          path: target
      - name: Extract TieBreaker
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/.automation-extract-tiebreaker.py
      - name: Verify and push
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for f in \
            src/xmpp/xmpp-im/jingle.h \
            src/xmpp/xmpp-im/jingle-tiebreaker.h \
            src/xmpp/xmpp-im/jingle.cpp \
            src/xmpp/xmpp-im/jingle-tiebreaker.cpp \
            src/xmpp/xmpp-im/jingle-session.h \
            src/xmpp/CMakeLists.txt \
            include/iris/jingle-tiebreaker.h; do
            test "$(tail -c 1 "$f" | od -An -t x1 | tr -d ' \n')" = 0a
          done
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add src/xmpp/xmpp-im/jingle.h \
                  src/xmpp/xmpp-im/jingle-tiebreaker.h \
                  src/xmpp/xmpp-im/jingle.cpp \
                  src/xmpp/xmpp-im/jingle-tiebreaker.cpp \
                  src/xmpp/xmpp-im/jingle-session.h \
                  src/xmpp/CMakeLists.txt \
                  include/iris/jingle-tiebreaker.h
          git commit -m 'Split Jingle TieBreaker into dedicated files'
          git push origin HEAD:jingle/async-media
