name: Fix Iris ZLIB library override

on:
  push:
    branches: [ ci/qca3-pipelines ]
    paths:
      - .github/workflows/fix-zlib-library.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/qca3-pipelines
          fetch-depth: 0
      - name: Apply fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/xmpp/CMakeLists.txt')
          text = path.read_text()
          old = 'set(ZLIB_LIBRARY_RELEASE "${_iris_zlib_library}" CACHE FILEPATH "ZLIB release library" FORCE)'
          new = 'set(ZLIB_LIBRARY "${_iris_zlib_library}" CACHE FILEPATH "ZLIB library" FORCE)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old ZLIB override, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-zlib-library.yml
          git add src/xmpp/CMakeLists.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix explicit Windows ZLIB library override"
          git push origin HEAD:ci/qca3-pipelines
