name: PR 104 validator cleanup

on:
  push:
    branches:
      - ai/active-bundle-content-add

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/active-bundle-content-add
      - name: Remove duplicate active-extension validator
        run: python3 .github/pr104_validator_cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/xmpp/xmpp-im/jingle-group-negotiation_p.h tests/jingle/groupnegotiation.cpp
          git commit -m 'Remove duplicate active BUNDLE extension validator'
          git push origin HEAD:ai/active-bundle-content-add
