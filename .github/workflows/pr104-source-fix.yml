name: PR 104 source fix

on:
  push:
    branches:
      - ai/active-bundle-content-add

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/active-bundle-content-add
      - name: Fix Stanza error type qualification
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Stanza::ErrorType::/Stanza::Error::ErrorType::/g' src/xmpp/xmpp-im/jingle-session.cpp
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/xmpp/xmpp-im/jingle-session.cpp
          git commit -m 'Fix Stanza error type qualification'
          git push origin HEAD:ai/active-bundle-content-add
