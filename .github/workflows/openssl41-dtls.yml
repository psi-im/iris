name: OpenSSL 4.1 Jingle DTLS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iris-openssl41-dtls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openssl41-jingle-dtls:
    name: openssl41-jingle-dtls
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build perl curl ca-certificates git \
            qt6-base-dev libusrsctp-dev zlib1g-dev

      - name: Configure isolated OpenSSL and QCA paths
        run: |
          echo "OPENSSL_PREFIX=$GITHUB_WORKSPACE/openssl41" >> "$GITHUB_ENV"
          echo "QCA_PREFIX=$GITHUB_WORKSPACE/qca41-sdk" >> "$GITHUB_ENV"

      - name: Cache compiled OpenSSL 4.1.0
        uses: actions/cache@v4
        with:
          path: openssl41
          key: openssl-4.1.0-shared-lib-ubuntu24.04-v1

      - name: Build verified OpenSSL 4.1.0
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$OPENSSL_PREFIX/bin/openssl" ]]; then
            url=https://github.com/openssl/openssl/releases/download/openssl-4.1.0/openssl-4.1.0.tar.gz
            curl -fL --retry 3 --output openssl-4.1.0.tar.gz "$url"
            expected=$(curl -fsSL --retry 3 "$url.sha256" | awk 'NR==1 {print $1}')
            [[ "$expected" =~ ^[a-fA-F0-9]{64}$ ]]
            echo "$expected  openssl-4.1.0.tar.gz" | sha256sum -c -
            tar -xf openssl-4.1.0.tar.gz
            (
              cd openssl-4.1.0
              ./Configure linux-x86_64 shared no-tests \
                --prefix="$OPENSSL_PREFIX" --openssldir="$OPENSSL_PREFIX/ssl" \
                --libdir=lib
              make -j4
              make install_sw
            )
          fi
          "$OPENSSL_PREFIX/bin/openssl" version -v | tee "$RUNNER_TEMP/openssl-version"
          grep -F "OpenSSL 4.1.0" "$RUNNER_TEMP/openssl-version"
          test -f "$OPENSSL_PREFIX/lib/libssl.so.4"
          test -f "$OPENSSL_PREFIX/lib/libcrypto.so.4"

      - name: Build QCA 3.2.0 provider against OpenSSL 4.1.0
        shell: bash
        run: |
          set -euo pipefail
          qca_tag=$(jq -r .qca.tag dependencies.lock.json)
          qca_commit=$(jq -r .qca.commit dependencies.lock.json)
          test "$qca_tag" = v3.2.0
          git clone --depth 1 --branch "$qca_tag" https://github.com/psi-im/qca.git qca41-src
          test "$(git -C qca41-src rev-parse HEAD)" = "$qca_commit"
          cmake -S qca41-src -B qca41-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_QT6=ON -DQCA_SUFFIX=qt6 \
            -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_PLUGINS=ossl \
            -DQCA_INSTALL_IN_QT_PREFIX=OFF \
            -DCMAKE_INSTALL_PREFIX="$QCA_PREFIX" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so" \
            -DCMAKE_BUILD_RPATH="$OPENSSL_PREFIX/lib" \
            -DCMAKE_INSTALL_RPATH="$OPENSSL_PREFIX/lib"
          cmake --build qca41-build --parallel 4
          cmake --install qca41-build

          # Only this private build of qca-ossl is available to the test.
          provider=$(find "$QCA_PREFIX/lib/qca3-qt6" -type f -name '*qca-ossl*.so' -print -quit)
          test -n "$provider"
          LD_LIBRARY_PATH="$OPENSSL_PREFIX/lib:$QCA_PREFIX/lib" ldd "$provider" | tee "$RUNNER_TEMP/qca-ossl-ldd.txt"
          grep -E "libssl[.]so[.]4 => $OPENSSL_PREFIX/lib/libssl[.]so[.]4" "$RUNNER_TEMP/qca-ossl-ldd.txt"
          grep -E "libcrypto[.]so[.]4 => $OPENSSL_PREFIX/lib/libcrypto[.]so[.]4" "$RUNNER_TEMP/qca-ossl-ldd.txt"

      - name: Build Iris DTLS-SRTP and SCTP regression test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/jingle -B build-jingle-openssl41 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_QT6=ON -DIRIS_SYSTEM_QCA=3 -DIRIS_BUNDLED_QCA=OFF \
            -DIRIS_BUNDLED_USRSCTP=OFF -DIRIS_ENABLE_JINGLE_SCTP=ON \
            -DIRIS_ENABLE_OMEMO=OFF \
            -DCMAKE_PREFIX_PATH="$QCA_PREFIX" \
            -DQca3-qt6_DIR="$QCA_PREFIX/lib/cmake/Qca3-qt6" \
            -DCMAKE_BUILD_RPATH="$OPENSSL_PREFIX/lib;$QCA_PREFIX/lib"
          cmake --build build-jingle-openssl41 --parallel 4 --target jingle_dtlssrtp_test

      - name: Test real Jingle DTLS handshake with OpenSSL 4.1.0
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$OPENSSL_PREFIX/lib:$QCA_PREFIX/lib"
          export OPENSSL_MODULES="$OPENSSL_PREFIX/lib/ossl-modules"
          export QCA_PLUGIN_PATH="$QCA_PREFIX/lib/qca3-qt6"
          # Keep loader/plugin diagnostics for proof that OpenSSL 4.1 and
          # the newly compiled qca-ossl provider were actually loaded.
          LD_DEBUG=libs QT_DEBUG_PLUGINS=1 \
            ./build-jingle-openssl41/jingle_dtlssrtp_test \
            > "$RUNNER_TEMP/jingle-dtls-openssl41.log" 2>&1 || {
              tail -n 160 "$RUNNER_TEMP/jingle-dtls-openssl41.log"
              exit 1
            }
          grep -F "Iris/QCA3 DTLS-SRTP key-export and SCTP mux integration passed" \
            "$RUNNER_TEMP/jingle-dtls-openssl41.log"
          grep -F "$OPENSSL_PREFIX/lib/libssl.so.4" "$RUNNER_TEMP/jingle-dtls-openssl41.log" >/dev/null
          grep -F "$OPENSSL_PREFIX/lib/libcrypto.so.4" "$RUNNER_TEMP/jingle-dtls-openssl41.log" >/dev/null
          grep -E 'loaded library.*qca-ossl' "$RUNNER_TEMP/jingle-dtls-openssl41.log" | head -n 3
