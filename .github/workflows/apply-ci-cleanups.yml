name: Apply CI cleanups

on:
  push:
    branches: [ ci/qca3-pipelines ]
    paths:
      - .github/workflows/apply-ci-cleanups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/qca3-pipelines
          fetch-depth: 0

      - name: Apply changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()

          old = '''          - name: qt6-qca3-omemo
            qt_major: 6
            qca: qca3
            deps: qt6-base-dev
            options: -DUSE_QT6=ON -DIRIS_SYSTEM_QCA=3 -DIRIS_BUNDLED_QCA=OFF -DIRIS_ENABLE_OMEMO=ON
'''
          new = '''          - name: qt6-qca3-omemo
            qt_major: 6
            qca: qca3
            deps: qt6-base-dev libomemo-c-dev
            options: -DUSE_QT6=ON -DIRIS_SYSTEM_QCA=3 -DIRIS_BUNDLED_QCA=OFF -DIRIS_ENABLE_OMEMO=ON -DIRIS_BUNDLED_OMEMO_C=OFF
'''
          if old not in ci:
              raise SystemExit('OMEMO matrix block not found')
          ci = ci.replace(old, new, 1)

          old = '''      - name: Restore vcpkg binary cache on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.image }}-x64-windows-static-v1
          restore-keys: |
            iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-
'''
          new = '''      - name: Restore vcpkg binary cache on Windows
        if: runner.os == 'Windows'
        id: restore-vcpkg-binary-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.image }}-x64-windows-static-v1
          restore-keys: |
            iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-
'''
          if old not in ci:
              raise SystemExit('vcpkg restore block not found')
          ci = ci.replace(old, new, 1)

          old = '''      - name: Install static zlib on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows
'''
          new = '''      - name: Install static zlib on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg binary cache on Windows
        if: runner.os == 'Windows' && steps.restore-vcpkg-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.image }}-x64-windows-static-v1

      - name: Configure Windows
'''
          if old not in ci:
              raise SystemExit('vcpkg install block not found')
          ci = ci.replace(old, new, 1)

          old = '''          $zlibRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\\x64-windows-static'
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$pwd/sdk" `
            "-DCMAKE_PREFIX_PATH=$pwd/qca-sdk;$env:QT_ROOT_DIR" `
            "-DZLIB_ROOT=$zlibRoot" `
'''
          new = '''          $zlibRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\\x64-windows-static'
          $zlibLibrary = Join-Path $zlibRoot 'lib\\zlib.lib'
          $zlibInclude = Join-Path $zlibRoot 'include'
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$pwd/sdk" `
            "-DCMAKE_PREFIX_PATH=$pwd/qca-sdk;$env:QT_ROOT_DIR" `
            "-DZLIB_LIBRARY=$zlibLibrary" `
            "-DZLIB_INCLUDE_DIR=$zlibInclude" `
'''
          if old not in ci:
              raise SystemExit('Windows ZLIB configure block not found')
          ci = ci.replace(old, new, 1)
          ci_path.write_text(ci)

          cmake_path = Path('src/xmpp/CMakeLists.txt')
          cmake = cmake_path.read_text()
          old = '''if(POLICY CMP0074)
    cmake_policy(SET CMP0074 NEW)
endif()
if(WIN32 AND ZLIB_ROOT)
    set(_iris_zlib_library "${ZLIB_ROOT}/lib/zlib.lib")
    set(_iris_zlib_include "${ZLIB_ROOT}/include")
    if(EXISTS "${_iris_zlib_library}" AND EXISTS "${_iris_zlib_include}/zlib.h")
        set(ZLIB_LIBRARY "${_iris_zlib_library}" CACHE FILEPATH "ZLIB library" FORCE)
        set(ZLIB_INCLUDE_DIR "${_iris_zlib_include}" CACHE PATH "ZLIB include directory" FORCE)
    endif()
endif()
find_package(ZLIB REQUIRED)
'''
          new = '''if(POLICY CMP0074)
    cmake_policy(SET CMP0074 NEW)
endif()
find_package(ZLIB REQUIRED)
'''
          if old not in cmake:
              raise SystemExit('CMake ZLIB workaround block not found')
          cmake_path.write_text(cmake.replace(old, new, 1))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-ci-cleanups.yml
          git add .github/workflows/ci.yml src/xmpp/CMakeLists.txt
          git commit -m "Use system OMEMO on Linux CI and fix Windows dependency cache"
          git push origin HEAD:ci/qca3-pipelines
