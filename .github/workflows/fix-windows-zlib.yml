name: Fix Iris Windows ZLIB discovery

on:
  push:
    branches: [ ci/qca3-pipelines ]
    paths:
      - .github/workflows/fix-windows-zlib.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/qca3-pipelines
          fetch-depth: 0

      - name: Fix Windows ZLIB arguments and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '            "-DZLIB_ROOT=$zlibRoot" `'
          new = ('            "-DZLIB_LIBRARY=$zlibRoot/lib/zlib.lib" `\n'
                 '            "-DZLIB_INCLUDE_DIR=$zlibRoot/include" `')
          for filename in ('.github/workflows/ci.yml', '.github/workflows/packages.yml'):
              path = Path(filename)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: expected one ZLIB_ROOT argument, found {text.count(old)}')
              path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-windows-zlib.yml
          git add .github/workflows/ci.yml .github/workflows/packages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix Windows ZLIB discovery in CI and packages"
          git push origin HEAD:ci/qca3-pipelines
