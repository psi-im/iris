name: Temporary DTLS final clang-format
on:
  push:
    branches: [feat/encryption-session-stream-api]
    paths:
      - .github/workflows/_temporary-dtls-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format modified C++ lines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git-clang-format-18 >/dev/null || ! command -v clang-format-18 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang-format-18
          fi
          git clang-format-18 --binary clang-format-18 61e340ec661882fbb4f605a89127d1bfeee52404 || test -n "$(git diff --name-only)"
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Format ICE DTLS verification refactor"
            git push origin HEAD:refs/heads/feat/encryption-session-stream-api
          fi
