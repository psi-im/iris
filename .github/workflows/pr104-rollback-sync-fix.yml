name: PR 104 rollback sync fix

on:
  push:
    branches:
      - ai/active-bundle-content-add

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/active-bundle-content-add
      - name: Wait for rejected content completion
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("tests/jingle/bundlesignaling.cpp"); s=p.read_text(); old="                  && icePad->liveAssociationCount() == 1;\n          }),\n          \"local rejection changed established BUNDLE topology or lifetime\");"; new="                  && icePad->liveAssociationCount() == 1\n                  && rejectedFt->state() == J::State::Finished;\n          }),\n          \"local rejection changed established BUNDLE topology or lifetime\");"; assert old in s; p.write_text(s.replace(old,new,1))'
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/jingle/bundlesignaling.cpp
          git commit -m 'Wait for active BUNDLE rejection rollback completion'
          git push origin HEAD:ai/active-bundle-content-add
