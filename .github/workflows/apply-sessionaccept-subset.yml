name: Apply subset session-accept patch

on:
  push:
    branches:
      - jingle/async-media

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: contains(github.event.head_commit.message, 'Stage subset session-accept patch')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: jingle/async-media
      - run: python3 .github/sessionaccept-subset-patch.py
      - run: |
          git rm .github/workflows/apply-sessionaccept-subset.yml .github/sessionaccept-subset-patch.py
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add src/xmpp/xmpp-im/jingle-session.cpp
          git commit -m 'Handle omitted initial contents in session-accept'
          git push origin HEAD:jingle/async-media
