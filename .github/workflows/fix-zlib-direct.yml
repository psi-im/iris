name: Apply final Windows ZLIB fix

on:
  push:
    branches: [ ci/qca3-pipelines ]
    paths:
      - .github/workflows/fix-zlib-direct.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/qca3-pipelines
          fetch-depth: 0

      - name: Patch workflows and CMake
        shell: python
        run: |
          from pathlib import Path

          for name in ('.github/workflows/ci.yml', '.github/workflows/packages.yml'):
              p = Path(name)
              s = p.read_text()

              old_restore = '''      - name: Restore vcpkg binary cache on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
'''
              new_restore = '''      - name: Restore vcpkg binary cache on Windows
        if: runner.os == 'Windows'
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v4
        with:
'''
              if old_restore not in s:
                  raise SystemExit(f'{name}: restore block not found')
              s = s.replace(old_restore, new_restore, 1)

              install_marker = '''      - name: Install static zlib on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows
'''
              install_replacement = '''      - name: Install static zlib on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg binary cache on Windows
        if: runner.os == 'Windows' && steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.image }}-x64-windows-static-v1

      - name: Configure Windows
'''
              if install_marker not in s:
                  raise SystemExit(f'{name}: install marker not found')
              s = s.replace(install_marker, install_replacement, 1)

              old_config = '''          $zlibRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\\x64-windows-static'
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$pwd/sdk" `
            "-DCMAKE_PREFIX_PATH=$pwd/qca-sdk;$env:QT_ROOT_DIR" `
            "-DZLIB_ROOT=$zlibRoot" `
'''
              new_config = '''          $zlibRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\\x64-windows-static'
          $zlibLibrary = Join-Path $zlibRoot 'lib\\zlib.lib'
          $zlibInclude = Join-Path $zlibRoot 'include'
          if (!(Test-Path $zlibLibrary) -or !(Test-Path (Join-Path $zlibInclude 'zlib.h'))) {
            throw "Static zlib installation is incomplete: $zlibRoot"
          }
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$pwd/sdk" `
            "-DCMAKE_PREFIX_PATH=$pwd/qca-sdk;$env:QT_ROOT_DIR" `
            "-DZLIB_LIBRARY=$zlibLibrary" `
            "-DZLIB_INCLUDE_DIR=$zlibInclude" `
            -DZLIB_USE_STATIC_LIBS=ON `
'''
              if old_config not in s:
                  raise SystemExit(f'{name}: configure block not found')
              s = s.replace(old_config, new_config, 1)
              p.write_text(s)

          p = Path('src/xmpp/CMakeLists.txt')
          s = p.read_text()
          old = '''cmake_minimum_required(VERSION 3.10.0)

if(POLICY CMP0074)
    cmake_policy(SET CMP0074 NEW)
endif()
if(WIN32 AND ZLIB_ROOT)
    set(_iris_zlib_library "${ZLIB_ROOT}/lib/zlib.lib")
    set(_iris_zlib_include "${ZLIB_ROOT}/include")
    if(EXISTS "${_iris_zlib_library}" AND EXISTS "${_iris_zlib_include}/zlib.h")
        set(ZLIB_LIBRARY "${_iris_zlib_library}" CACHE FILEPATH "ZLIB library" FORCE)
        set(ZLIB_INCLUDE_DIR "${_iris_zlib_include}" CACHE PATH "ZLIB include directory" FORCE)
    endif()
endif()
find_package(ZLIB REQUIRED)
'''
          new = '''cmake_minimum_required(VERSION 3.10.0)

find_package(ZLIB REQUIRED)
'''
          if old not in s:
              raise SystemExit('src/xmpp/CMakeLists.txt: old ZLIB workaround not found')
          p.write_text(s.replace(old, new, 1))

      - name: Commit changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-zlib-direct.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .github/workflows/packages.yml src/xmpp/CMakeLists.txt .github/workflows/fix-zlib-direct.yml
          git commit -m 'Fix Windows static ZLIB discovery'
          git push origin HEAD:ci/qca3-pipelines
