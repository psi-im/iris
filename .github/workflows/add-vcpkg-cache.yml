name: Add Windows vcpkg binary cache

on:
  push:
    branches: [ ci/qca3-pipelines ]
    paths:
      - .github/workflows/add-vcpkg-cache.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/qca3-pipelines
          fetch-depth: 0

      - name: Add shared zlib binary cache and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '''      - name: Install static zlib on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

          new = '''      - name: Prepare vcpkg binary cache on Windows
        if: runner.os == 'Windows'
        id: vcpkg-cache
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          $imageVersion = if ($env:ImageVersion) { $env:ImageVersion } else { 'unknown' }
          $imageVersion = $imageVersion -replace '[^A-Za-z0-9_.-]', '_'
          "image=$imageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.image }}-x64-windows-static-v1
          restore-keys: |
            iris-vcpkg-zlib-${{ runner.os }}-${{ runner.arch }}-

      - name: Install static zlib on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

          for filename in ('.github/workflows/ci.yml', '.github/workflows/packages.yml'):
              path = Path(filename)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected one zlib install block, found {count}')
              path.write_text(text.replace(old, new))
          PY

          git rm .github/workflows/add-vcpkg-cache.yml
          git add .github/workflows/ci.yml .github/workflows/packages.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Cache Windows vcpkg zlib binaries"
          git push origin HEAD:ci/qca3-pipelines
