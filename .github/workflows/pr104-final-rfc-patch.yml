name: PR 104 final RFC patch

on:
  push:
    branches:
      - ai/active-bundle-content-add

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/active-bundle-content-add
      - name: Apply final RFC 9143 regression and docs update
        run: python3 .github/pr104_final_rfc_patch.py
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/jingle.md tests/jingle/bundlesignaling.cpp
          git commit -m 'Test strict active BUNDLE extension answers'
          git push origin HEAD:ai/active-bundle-content-add
