name: Build Iris for Android
description: Install Android dependencies, configure, build and install Iris

inputs:
  qt-version:
    description: Qt version
    required: true
  qt-arch:
    description: Qt Android architecture name
    required: true
  abi:
    description: Android ABI name used by the QCA SDK
    required: true
  ndk-version:
    description: Android NDK version
    required: true
  android-api:
    description: Minimum Android API level
    required: true
  install-prefix:
    description: CMake install prefix
    required: true
  iris-build-type:
    description: Iris library type
    required: false
    default: shared
  build-type:
    description: CMake build type
    required: false
    default: Release

outputs:
  ndk-path:
    description: Installed Android NDK path
    value: ${{ steps.setup-ndk.outputs.ndk-path }}

runs:
  using: composite
  steps:
    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ inputs.ndk-version }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        host: all_os
        target: android
        arch: ${{ inputs.qt-arch }}
        cache: true

    - name: Install pinned QCA SDK
      uses: ./.github/actions/load-dependencies
      with:
        qca-asset: qca3-qt6-android-${{ inputs.abi }}.zip
        install-mode: sdk
        qca-directory: qca-sdk

    - name: Require an exactly matched Qt 6.12 QCA SDK
      shell: bash
      run: |
        test -f qca-sdk/QT-SDK-VERSION.txt
        test "$(tr -d '\r\n' < qca-sdk/QT-SDK-VERSION.txt)" = "${{ inputs.qt-version }}"

    - name: Configure, build and install Iris
      shell: bash
      env:
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        qt_cmake=$(find "$QT_ROOT_DIR" -type f -name qt-cmake -print -quit)
        test -n "$qt_cmake"
        chmod +x "$qt_cmake"
        if [ "${{ inputs.iris-build-type }}" = "static" ]; then
          iris_build_args=("-DBUILD_SHARED_LIBS=OFF" "-DIRIS_POSITION_INDEPENDENT_CODE=ON")
        else
          iris_build_args=("-DBUILD_SHARED_LIBS=ON")
        fi
        "$qt_cmake" -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ inputs.build-type }}" \
          -DCMAKE_INSTALL_PREFIX="${{ inputs.install-prefix }}" \
          -DANDROID_PLATFORM="android-${{ inputs.android-api }}" \
          "-DQca3-qt6_DIR=$PWD/qca-sdk/lib/cmake/Qca3-qt6" \
          -DUSE_QT6=ON \
          "${iris_build_args[@]}" \
          -DIRIS_SYSTEM_QCA=3 -DIRIS_BUNDLED_QCA=OFF \
          -DIRIS_ENABLE_OMEMO=ON -DIRIS_BUNDLED_OMEMO_C=ON \
          -DIRIS_BUNDLED_USRSCTP=ON
        cmake --build build --parallel
        cmake --install build
        test -f "${{ inputs.install-prefix }}/include/iris/xmpp_omemo.h"
        test -f "${{ inputs.install-prefix }}/include/iris/xmpp-im/xmpp_omemo.h"
